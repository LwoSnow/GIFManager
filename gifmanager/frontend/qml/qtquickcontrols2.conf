// Force the Basic style.
//
// The default style on Windows is the NATIVE one, and a native style refuses
// customization: every `background` and `contentItem` override is reported as
// "The current style does not support customization of this control" and is then
// silently ignored. The result would be a half-applied theme — some controls
// following the palette and others drawing themselves in the system colours.
//
// Basic is the style designed to be customized, which is what a themed
// application needs. Fusion is the alternative; Basic is chosen because it is the
// least opinionated and therefore the least to override.
//
// 强制使用 Basic 样式。
//
// Windows 上的默认样式是"原生"样式，而原生样式拒绝定制：每一处 `background` 与
// `contentItem` 覆盖都会被报告为"当前样式不支持定制该控件"，随后被静默忽略。结果会是
// 主题只被应用一半——一部分控件跟随调色板，另一部分用系统颜色自我绘制。
//
// Basic 就是为可定制而设计的样式，这正是需要主题化的应用所必需的。备选是 Fusion；选
// Basic 是因为它最少有主张，因而需要覆盖的东西最少。
[Controls]
Style=Basic
