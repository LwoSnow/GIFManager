name: build

# Build and check on all three target systems.
#
# The whole point of this refactor is that the non-Qt layers run everywhere, so
# the matrix runs the LAYER CHECK and the pure-Python tests on every platform.
# Only the Qt shell needs a display, and it uses the offscreen platform plugin so
# no virtual framebuffer is required.
#
# 在三个目标系统上构建并检查。
#
# 这次重构的全部意义就在于非 Qt 各层可以在任何系统上运行，因此矩阵在每个平台上都跑
# 分层检查与纯 Python 测试。只有 Qt 外壳需要显示器，而它使用离屏平台插件，因此无需
# 虚拟帧缓冲。

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  PYTHONUTF8: "1"
  QT_QPA_PLATFORM: offscreen

jobs:
  check:
    name: check (${{ matrix.os }} / py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: "3.12"
            artifact: GIFManager-windows
          - os: macos-latest
            python: "3.12"
            artifact: GIFManager-macos
          - os: ubuntu-latest
            python: "3.12"
            artifact: GIFManager-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python / 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies / 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Runs FIRST because it needs no dependencies at all: a layering violation
      # is a design error, not a runtime one, and catching it before a three-minute
      # Qt install gives faster feedback.
      # 最先运行，因为它完全不需要依赖：分层违规是设计错误而非运行时错误，在耗时数分钟
      # 的 Qt 安装之前发现它能更快给出反馈。
      - name: Verify layering / 校验分层
        run: python tools/check_layers.py

      - name: Verify style / 校验风格
        run: python tools/check_style.py gifmanager apps tests tools

      - name: Run tests / 运行测试
        run: python -m unittest discover -s tests -t . -p "test_*.py"

      - name: Smoke-test the Qt shell / Qt 外壳冒烟测试
        run: python tests/smoke_qt.py

  package:
    name: package (${{ matrix.os }})
    needs: check
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: GIFManager-windows
          - os: macos-latest
            artifact: GIFManager-macos
          - os: ubuntu-latest
            artifact: GIFManager-linux

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python / 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies / 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Build the bundle / 构建打包产物
        run: python -m PyInstaller --noconfirm --clean packaging/GIFManagerNext.spec

      - name: Upload the bundle / 上传打包产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/GIFManager
          if-no-files-found: error
