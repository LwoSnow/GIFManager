# GitHub Actions — 手动构建 Windows 发布包
#
# 触发方式：
#   GitHub 仓库页面 → Actions → "Build Windows Package" → Run workflow
#   （可在输入框中指定版本号，默认 1.0.2）
#
# 产物（在 workflow 运行结果页的 Artifacts 中下载）：
#   - release/GIFManager-<version>-win64.zip        便携压缩包（解压即用）
#   - release/GIFManager-Setup-<version>.exe        Inno Setup 安装包
#
# 本地复现：
#   pip install -r requirements.txt pyinstaller
#   pyinstaller --noconfirm --clean GIFManager.spec

name: Build Windows Package

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version used to name the artifacts, e.g. 1.0.2"
        required: false
        default: "1.0.2"

permissions:
  contents: read

jobs:
  build-windows:
    name: Build installer + zip (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build with PyInstaller (onedir)
        run: pyinstaller --noconfirm --clean GIFManager.spec

      - name: Prepare release directory
        shell: pwsh
        run: New-Item -ItemType Directory -Force release | Out-Null

      - name: Create portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "dist\GIFManager" `
            -DestinationPath "release\GIFManager-${{ inputs.version }}-win64.zip" -Force

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "C:\Program Files*\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue |
                  Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $iscc) {
            Write-Error "ISCC.exe not found under C:\Program Files*\Inno Setup*"
            exit 1
          }
          & $iscc "/DMyAppVersion=${{ inputs.version }}" "installer\GIFManager.iss"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GIFManager-${{ inputs.version }}
          path: |
            release/GIFManager-${{ inputs.version }}-win64.zip
            release/GIFManager-Setup-${{ inputs.version }}.exe
          if-no-files-found: error
