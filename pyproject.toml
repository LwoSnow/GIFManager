[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gifmanager"
version = "2.0.0"
description = "Modular, cross-platform emoji and sticker manager"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "LwoSnow" }]
keywords = ["emoji", "sticker", "gif", "qt", "pyside6", "cross-platform"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Desktop Environment",
]

# Pinned: Qt patch releases change behaviour, and an inconsistent version across
# environments is the hardest class of bug to reproduce.
# 锁定版本：Qt 补丁版本会引入行为变化，而跨环境版本不一致是最难复现的一类问题。
dependencies = [
    "PySide6==6.11.1",
    "shiboken6==6.11.1",
]

[project.optional-dependencies]
# Pillow is the fallback image converter when ffmpeg is absent. The application
# runs without it; conversion then requires ffmpeg.
# Pillow 是缺少 ffmpeg 时的图片转换回退方案。没有它程序仍可运行；此时转换需要 ffmpeg。
pillow = ["Pillow==12.3.0"]
dev = ["pyinstaller>=6.0"]

[project.scripts]
# The Qt WIDGETS shell, kept under its historical name.
# Qt "Widgets" 外壳，保留其历史名称。
gifmanager = "gifmanager.frontend.qt.shell:main"
# The QML front-end: the rebuilt interface, and the one `python -m gifmanager` runs.
# QML 前端：重建后的界面，也是 `python -m gifmanager` 所运行的。
gifmanager-qml = "gifmanager.__main__:main"

[project.gui-scripts]
gifmanager-gui = "gifmanager.frontend.qt.shell:main"

[project.urls]
Homepage = "https://github.com/LwoSnow/GIFManager"
Issues = "https://github.com/LwoSnow/GIFManager/issues"

[tool.setuptools]
packages = [
    "gifmanager",
    "gifmanager.core",
    "gifmanager.core.imaging",
    "gifmanager.core.store",
    "gifmanager.platform",
    "gifmanager.backend",
    "gifmanager.frontend",
    "gifmanager.frontend.qt",
    "gifmanager.frontend.qt.dialogs",
    "gifmanager.frontend.qt.theme",
    "gifmanager.frontend.qt.widgets",
]

[tool.setuptools.package-data]
gifmanager = ["../../resources/language/*.json"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*"]
